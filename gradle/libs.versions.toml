[versions]
agp = "9.1.0"
kotlin = "2.4.20"
coreKtx = "1.16.0"
lifecycle = "2.9.1"
activityCompose = "1.10.1"
composeBom = "2026.09.00"
okhttp = "4.12.0"
serialization = "1.8.1"
coroutines = "1.10.2"
junit = "4.13.2"
markwon = "4.6.2"
datastore = "1.1.7"
glance = "1.1.1"
wearCompose = "1.5.0"
wearTiles = "1.4.1"
wearProtolayout = "1.2.1"
carApp = "1.7.0"
biometric = "1.1.0"
fragment = "1.8.9"
camerax = "1.4.2"
billing = "7.1.1"
sshj = "0.38.0"
zxing = "4.3.0"
guava = "33.4.0-android"
# Le verre liquide : le flou des vitres **et** la réfraction du contenu.
#
# Haze 2 a **séparé ses effets en modules** : `haze` porte le cœur (l'état, la source, le nœud
# d'effet), `haze-blur` le flou, `haze-glass` le **verre** — réfraction, profil d'arête, dispersion
# chromatique, reflet spéculaire piloté par le doigt, et ses propres replis matériels.
#
# Le prix du saut est explicite : Haze 2.0.1 réclame Compose 1.12.1 (`composeBom = 2026.09.00`) et
# Kotlin 2.4.20, et son AAR exige `compileSdk = 37`. Les trois sont donc montés ensemble — c'est un
# seul mouvement, pas trois.
haze = "2.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wearProtolayout" }
androidx-car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
# Le cœur : `HazeState`, `hazeSource`, `hazeEffect`, le nœud d'effet, les replis.
# `haze-materials`/`haze-blur-materials` sont **volontairement écartés** : ils tirent
# `androidx.compose.material3` (`HazeMaterials` n'est qu'un habillage Material), et l'app ne doit
# aucun composant Material.
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
# Le flou : le repli de tous les appareils, et le seul effet des versions qui refusent le verre.
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
# Le **verre** : réfraction du contenu échantillonné, profil d'arête, dispersion chromatique,
# reflet spéculaire au doigt, et la sélection automatique du moteur (complet ou limité).
haze-glass = { group = "dev.chrisbanes.haze", name = "haze-glass", version.ref = "haze" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
eddsa = { group = "net.i2p.crypto", name = "eddsa", version = "0.3.0" }
zxing-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon-strikethrough = { group = "io.noties.markwon", name = "ext-strikethrough", version.ref = "markwon" }
markwon-tables = { group = "io.noties.markwon", name = "ext-tables", version.ref = "markwon" }
markwon-linkify = { group = "io.noties.markwon", name = "linkify", version.ref = "markwon" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
