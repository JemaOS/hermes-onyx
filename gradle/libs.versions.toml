[versions]
agp = "9.1.0"
kotlin = "2.4.20"
workRuntime = "2.10.0"
coreKtx = "1.16.0"
lifecycle = "2.9.1"
activityCompose = "1.10.1"
composeBom = "2026.09.00"
okhttp = "4.12.0"
serialization = "1.8.1"
coroutines = "1.10.2"
junit = "4.13.2"
markwon = "4.6.2"
datastore = "1.1.7"
glance = "1.1.1"
wearCompose = "1.5.0"
wearTiles = "1.4.1"
wearProtolayout = "1.2.1"
carApp = "1.7.0"
biometric = "1.1.0"
fragment = "1.8.9"
camerax = "1.4.2"
sshj = "0.38.0"
zxing = "4.3.0"
guava = "33.4.0-android"
# Liquid glass: the blur of the panes **and** the refraction of the content.
#
# Haze 2 **split its effects into modules**: `haze` carries the core (the state, the source, the effect
# node), `haze-blur` the blur, `haze-glass` the **glass** — refraction, edge profile, chromatic
# dispersion, specular highlight driven by the finger, and its own material fallbacks.
#
# The price of the jump is explicit: Haze 2.0.1 requires Compose 1.12.1 (`composeBom = 2026.09.00`) and
# Kotlin 2.4.20, and its AAR requires `compileSdk = 37`. All three are therefore raised together — it is a
# single move, not three.
backdrop = "2.0.1"
haze = "2.0.1"

[libraries]
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wearProtolayout" }
androidx-car-app = { group = "androidx.car.app", name = "app", version.ref = "carApp" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
# The core: `HazeState`, `hazeSource`, `hazeEffect`, the effect node, the fallbacks.
# `haze-materials`/`haze-blur-materials` are **deliberately excluded**: they pull in
# `androidx.compose.material3` (`HazeMaterials` is just Material wrapping), and the app must
# owe no Material component.
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
# The blur: the fallback for all devices, and the only effect of versions that refuse glass.
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
# The **glass**: refraction of the sampled content, edge profile, chromatic dispersion,
# specular highlight under the finger, and automatic engine selection (full or limited).
haze-glass = { group = "dev.chrisbanes.haze", name = "haze-glass", version.ref = "haze" }
# `io.github.kyant0:backdrop` — the lens (AGSL) and the page capture of liquid glass,
# Apache-2.0. See `OnyxLensGlass.kt` for the usage and the degradation.
kyant-backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
eddsa = { group = "net.i2p.crypto", name = "eddsa", version = "0.3.0" }
zxing-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon-strikethrough = { group = "io.noties.markwon", name = "ext-strikethrough", version.ref = "markwon" }
markwon-tables = { group = "io.noties.markwon", name = "ext-tables", version.ref = "markwon" }
markwon-linkify = { group = "io.noties.markwon", name = "linkify", version.ref = "markwon" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
