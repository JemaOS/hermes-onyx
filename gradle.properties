# JVM
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=6
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=37,37.0

# Kotlin
kotlin.code.style=official

# --- Identité de l'application : déclarée UNE fois, lue par les trois modules ---------------
#
# `onyx.applicationId` est le nom du paquet **installé** : c'est lui qu'Android résout pour les
# composants du manifeste (les alias du lanceur, les permissions, les autorités de fournisseur).
# `onyx.namespace` est le paquet du **code** : il porte les classes, et il reste stable quel que
# soit l'identifiant d'installation.
#
# Les deux valeurs ne sont écrites nulle part ailleurs : chaque module les injecte dans son
# manifeste par `${applicationId}` (composants) et `${onyxNamespace}` (contrats), et le code les
# lit à l'exécution par `context.packageName`. Changer d'identifiant se fait donc ici — un
# renommage validé se propage partout d'un coup par `-Ponyx.applicationId=com.onyx.app`.
onyx.applicationId=com.onyx.app
onyx.namespace=com.onyx.app

# --- Version ---------------------------------------------------------------------------------
# L'arbre public est la **copie aplatie** de l'arbre de fusion : son historique ne peut donc pas
# porter le numero de version (l'arbre de fusion, lui, le derive de son compte de commits). Le
# numero publie est ecrit **ici** et fait foi : c'est le `versionCode` des trois APK expedies.
# Le remplacer a chaque publication, sous peine de livrer un numero que rien ne porte.
onyx.versionCode=980
