# JVM
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=6
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=36

# Kotlin
kotlin.code.style=official

# Version
# versionCode = cette base + nombre de commits de la branche. La ligne 1.0.0 déjà publiée
# (versionCode 341) garde sa numérotation : 340 + 1 commit.
onyx.versionBaseline=340
