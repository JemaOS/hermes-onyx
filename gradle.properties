# JVM
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=6
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=37,37.0

# Kotlin
kotlin.code.style=official

# --- Application identity: declared ONCE, read by the three modules --------------------------
#
# `onyx.applicationId` is the **installed** package name: it is what Android resolves for the
# manifest components (launcher aliases, permissions, provider authorities).
# `onyx.namespace` is the **code** package: it carries the classes, and stays stable whatever
# the install identifier.
#
# Neither value is written anywhere else: each module injects them into its
# manifest through `${applicationId}` (components) and `${onyxNamespace}` (contracts), and the code
# reads them at run time through `context.packageName`. Changing identifier is therefore done here — a
# validated rename propagates everywhere at once through `-Ponyx.applicationId=com.onyx.app`.
onyx.applicationId=com.onyx.app
onyx.namespace=com.onyx.app

# --- Version ---------------------------------------------------------------------------------
# The public tree is the **flattened copy** of the merge tree: its history therefore cannot
# carry the version number (the merge tree, for its part, derives it from its commit count). The
# published number is written **here** and is authoritative: it is the `versionCode` of the three shipped APKs.
# Replace it on each release, or you ship a number that nothing carries.
onyx.versionCode=1230
# The **displayed** version is derived from this number: 1.3.1, then 1.3.2 on each release.
# `onyx.versionBase` is the code that carries the first 1.3.1 — a single source of truth, so it is
# impossible to forget one of the two numbers.
onyx.versionBase=1132
